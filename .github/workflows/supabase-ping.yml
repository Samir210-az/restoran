name: Supabase ping

on:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query database through the REST API
        env:
          SUPABASE_URL: https://qrbfpujqhrjtyvkrjygo.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_KCY6JwJPUTF-QLGYBZgt9A_0NPJh8GA
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/restaurants?select=id&limit=1")
          echo "HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then exit 1; fi
